# ansible.cfg — EC2 deployment (project-v2)
# host_key_checking=False: node EC2 baru -> SSH fingerprint gak nanya (first connect)
# remote_user=root: sesuai konvensi playbook (inventory juga set ansible_user=root)
# CATATAN: inventory TIDAK di-set di sini — SELALU pakai -i inventory-ec2-*.ini
# Lab TIDAK terpengaruh — lab pakai folder terpisah (bkpm-ha-lab)

[defaults]
host_key_checking = False
remote_user = root
ask_pass = False
