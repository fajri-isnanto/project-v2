# Inventory RabbitMQ EC2 — varian deploy client bkpm-ha-v2
# Controller = node1 (rb-1): ansible DIINSTALL di node1, manage node2 & node3 via SSH.
# IP privat AWS (10.192.x.x) — hanya bisa diakses dari dalam VPC, jadi ansible HARUS
# dijalankan dari node1 (atau mesin lain di VPC yang sama).
# Inventory lab (inventory.ini) TIDAK disentuh — file ini khusus EC2.
#
# CATATAN PENTING — SUITE REPO:
# EC2 = Ubuntu 26.04 (resolute). Repo Team RabbitMQ (deb1.rabbitmq.com) BELUM
# menyediakan suite "resolute" (docs resmi baru noble/jammy/focal/bookworm).
# Playbook fase 02 memakai {{ ansible_distribution_release }} untuk nama suite,
# yang di EC2 akan menghasilkan "resolute" -> apt update GAGAL (404).
# SOLUSI: override fact via extra var saat run (paket noble jalan normal di resolute):
#   -e ansible_distribution_release=noble
# Contoh run lengkap ada di bagian bawah file ini.
#
# SCOPE HARI INI = INSTALL-ONLY (fase 01 + 02). Fase 03 (cluster, vhost, user,
# default_queue_type=quorum) TIDAK dijalankan.
#
# CATATAN:
# - rb-1 = controller sekaligus node rabbitmq -> ansible_connection=local
# - rb-2 & rb-3 dikelola via SSH dari node1: pubkey node1 (/root/.ssh/id_rsa.pub)
#   WAJIB sudah ada di /root/.ssh/authorized_keys node2 & node3.
# - ansible_user=root: kalau EC2 menolak login root via SSH, ganti jadi ubuntu.

[rabbitmq]
rb-1 ansible_host=10.192.66.195 ansible_connection=local
rb-2 ansible_host=10.192.67.27
rb-3 ansible_host=10.192.67.133

[all:vars]
ansible_user=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3

[rabbitmq:vars]
ansible_ssh_private_key_file=/root/.ssh/id_rsa

# ============================================================
# CARA RUN (dari node1, di dalam direktori project-v2):
#   ansible-playbook -i inventory-ec2-rabbitmq.ini rabbitmq/01-dependensi-os.yml
#   ansible-playbook -i inventory-ec2-rabbitmq.ini rabbitmq/02-instalasi-core.yml \
#     -e ansible_distribution_release=noble
# ============================================================
