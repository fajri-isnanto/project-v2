# PgBouncer config — statis, tanpa jinja. Sama di semua node.
# Pool ke PG lokal (127.0.0.1:5432). Routing primary/read = HAProxy (Phase 5).

[databases]
# Semua database name → forward ke PG lokal.
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# PG 17 default scram-sha-256. userlist.txt berisi SCRAM secret (bukan plaintext),
# ditarik dari pg_authid.rolpassword oleh playbook 03c.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# transaction = aman + efisien buat query workbench. Statement lebih agresif
# tapi break prepared statement / multi-statement transaction.
pool_mode = transaction

# Pool sizing (lab). max_client_conn = batas koneksi client masuk,
# default_pool_size = koneksi server (ke PG) per user+database.
max_client_conn = 100
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_idle_timeout = 300
server_reset_query = DISCARD ALL

# Console admin (database virtual "pgbouncer") buat SHOW POOLS / SHOW STATS.
admin_users = postgres
stats_users = postgres

# Beberapa driver kirim parameter startup yang ga dikenal PgBouncer.
ignore_startup_parameters = extra_float_digits

# Logging (standar)
log_connections = 0
log_disconnections = 0
