# HAProxy configuration — load balancer untuk cluster Valkey (bkpm-ha-v2)
# Dipasang di EC2 TERPISAH (bukan di node valkey). Statis, tanpa jinja.
# Peran: single endpoint TCP :6379 -> otomatis mengarah ke PRIMARY valkey.
#
# KONSEP:
#   Health check "INFO replication" + expect "role:master":
#     - node yang jadi master   -> lulus check -> UP -> dapat traffic
#     - node yang jadi replica  -> gagal check -> DOWN -> nol traffic
#   Pas failover sentinel: master lama turun jadi slave (gagal check), replica
#   yang di-promote lulus check -> traffic pindah OTOMATIS tanpa restart.
#
# CATATAN PENTING:
#   - JANGAN pakai option redis-check (PING/PONG) — replica juga lulus PONG,
#     write ke replica bakal kena error READONLY. Check INFO + role:master
#     adalah kunci routing ke primary.
#   - Window failover sentinel (~10-30 detik) ada momen tanpa node yang lulus
#     check -> koneksi ditolak -> aplikasi WAJIB retry/backoff.
#   - Versi target: haproxy 3.2.9-1ubuntu2.2 (resolute 26.04) — syntax
#     tcp-check send/expect didukung.
#   - Frontend bind :6379 karena haproxy di mesin terpisah (port valkey
#     kosong di mesin ini) — aplikasi pakai port sama seperti connect langsung.

global
    log /dev/log local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 3s
    timeout client 300s
    timeout server 300s
    option log-health-checks

frontend valkey-in
    bind *:6379
    default_backend valkey-master

backend valkey-master
    option tcp-check
    tcp-check connect
    tcp-check send "PING\r\n"
    tcp-check expect string +PONG
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    server vk-1 10.192.66.146:6379 check inter 1s fall 2 rise 1
    server vk-2 10.192.67.33:6379  check inter 1s fall 2 rise 1
    server vk-3 10.192.67.251:6379 check inter 1s fall 2 rise 1
