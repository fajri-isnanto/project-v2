# Inventory BKPM HA v2 — self-contained (playbook lama tidak disentuh)
# Grup per project sesuai model 3 fase: 01-dependensi-os, 02-instalasi-core, 03-konfigurasi

[postgres]
pg-1 ansible_host=192.168.1.50
pg-2 ansible_host=192.168.1.51
pg-3 ansible_host=192.168.1.52

[valkey]
vk-1 ansible_host=192.168.1.53
vk-2 ansible_host=192.168.1.54
vk-3 ansible_host=192.168.1.55

[rabbitmq]
rb-1 ansible_host=192.168.1.56
rb-2 ansible_host=192.168.1.57
rb-3 ansible_host=192.168.1.58

[all:vars]
ansible_user=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3

[valkey:vars]
ansible_ssh_private_key_file=/root/.ssh/id_ed25519

[rabbitmq:vars]
ansible_ssh_private_key_file=/root/.ssh/id_ed25519

[postgres:vars]
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
