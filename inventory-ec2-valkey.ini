# Inventory Valkey EC2 — varian deploy client bkpm-ha-v2
# Controller = node1 (vk-1): ansible DIINSTALL di node1, manage node2 & node3 via SSH.
# IP privat AWS (10.192.x.x) — hanya bisa diakses dari dalam VPC, jadi ansible HARUS
# dijalankan dari node1 (atau mesin lain di VPC yang sama).
# Inventory lab (inventory.ini) TIDAK disentuh — file ini khusus EC2.
#
# CARA PAKAI (WAJIB sertakan -i — ansible.cfg mengarah ke inventory.ini lab):
#   ansible-playbook -i inventory-ec2-valkey.ini valkey/01-dependensi-os.yml
#   ansible-playbook -i inventory-ec2-valkey.ini valkey/02-instalasi-core.yml
#   ansible-playbook -i inventory-ec2-valkey.ini valkey/03-konfigurasi.yml
#   ansible-playbook -i inventory-ec2-valkey.ini valkey/04-verifikasi-instalasi.yml
#   ansible-playbook -i inventory-ec2-valkey.ini valkey/05-verifikasi-cluster.yml
#
# CATATAN:
# - vk-1 = controller sekaligus node valkey primary -> ansible_connection=local
#   (tidak butuh SSH key ke dirinya sendiri). Kalau mau seragam SSH, ganti jadi
#   ssh + pastikan pubkey node1 ada di /root/.ssh/authorized_keys node1 sendiri.
# - vk-2 & vk-3 dikelola via SSH dari node1: pubkey node1 (/root/.ssh/id_rsa.pub)
#   WAJIB sudah ada di /root/.ssh/authorized_keys node2 & node3 (atau user sesuai
#   ansible_user di bawah).
# - ansible_user=root: kalau EC2 menolak login root via SSH, ganti jadi ubuntu
#   dan tambahkan become: yes (playbook sudah become).

[valkey]
vk-1 ansible_host=10.192.66.146 ansible_connection=local
vk-2 ansible_host=10.192.67.33
vk-3 ansible_host=10.192.67.251

[all:vars]
ansible_user=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3

[valkey:vars]
ansible_ssh_private_key_file=/root/.ssh/id_rsa
