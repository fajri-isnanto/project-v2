# Valkey Sentinel Configuration (statis, tanpa Jinja)
# Copy ke /etc/valkey/sentinel.conf — sama di semua node

# Mode operasi — supervised systemd (unit valkey-sentinel.service, Type=notify)
daemonize no
supervised systemd
pidfile /var/run/valkey/sentinel.pid

# Port sentinel
port 26379

# Log
logfile /var/log/valkey/sentinel.log
loglevel notice

# Direktori
dir /var/lib/valkey

# Monitor master — node1 sebagai primary awal
sentinel monitor mymaster 10.192.66.146 6379 2

# Deteksi down
sentinel down-after-milliseconds mymaster 5000

# Timeout failover
sentinel failover-timeout mymaster 10000

# Parallel sync saat failover
sentinel parallel-syncs mymaster 1

# Auth (kosong — trusted network)
# sentinel auth-pass mymaster <password>
