# Valkey Server Configuration — REPLICA (node2 & node3)
# Statis, tanpa Jinja. Copy ke /etc/valkey/valkey.conf

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised systemd
pidfile /var/run/valkey/valkey.pid
logfile /var/log/valkey/valkey.log
loglevel notice
databases 16

# Snapshot (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/valkey

# Append Only File (AOF)
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
# maxmemory (diabsen — biarkan default)
# maxmemory-policy noeviction

# Replication — REPLICA: follow primary node1
replicaof 192.168.1.53 6379
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5

# Security — tanpa password (trusted network)
# protected-mode dimatikan: replika & sentinel konek dari node lain (tanpa requirepass)
protected-mode no
# requirepass <password>
# masterauth <password>  # kalau primary punya password

# Clients
maxclients 10000

# Performance
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitor
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""
