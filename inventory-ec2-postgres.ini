# Inventory PostgreSQL EC2 — varian deploy client bkpm-ha-v2
# Controller = node1 (pg-1): ansible DIINSTALL di node1, manage node2 & node3 via SSH.
# IP privat AWS (10.192.x.x) — hanya bisa diakses dari dalam VPC, jadi ansible HARUS
# dijalankan dari node1 (atau mesin lain di VPC yang sama).
# Inventory lab (inventory.ini) TIDAK disentuh — file ini khusus EC2.
#
# CARA PAKAI (WAJIB sertakan -i — ansible.cfg mengarah ke inventory.ini lab):
#   ansible-playbook -i inventory-ec2-postgres.ini postgres/01-dependensi-os.yml
#   ansible-playbook -i inventory-ec2-postgres.ini postgres/02-instalasi-core.yml
#   ansible-playbook -i inventory-ec2-postgres.ini postgres/03a-konfigurasi-etcd.yml
#   ansible-playbook -i inventory-ec2-postgres.ini postgres/03b-konfigurasi-patroni.yml
#   ansible-playbook -i inventory-ec2-postgres.ini postgres/03c-konfigurasi-pgbouncer.yml
#
# CATATAN:
# - pg-1 = controller sekaligus node postgres -> ansible_connection=local
# - pg-2 & pg-3 dikelola via SSH dari node1: pubkey node1 (/root/.ssh/id_rsa.pub)
#   WAJIB sudah ada di /root/.ssh/authorized_keys node2 & node3.
# - ansible_user=root: kalau EC2 menolak login root via SSH, ganti jadi ubuntu
#   dan tambahkan become: yes (playbook sudah become).
# - Hostname OS = ip-10-192-*-* (cloud-init, nama turunan private IPv4):
#     10.192.66.230 -> ip-10-192-66-230  (node1 = pg-1, controller)
#     10.192.67.65  -> ip-10-192-67-65   (node2 = pg-2)
#     10.192.67.184 -> ip-10-192-67-184  (node3 = pg-3)
#   Playbook TIDAK set hostname — /etc/hosts (fase 01) isi IP -> ip-10-192-*-*.
#   Semua URL (etcd/Patroni/etc) pakai IP langsung, BUKAN hostname.

[postgres]
pg-1 ansible_host=10.192.66.230 ansible_connection=local
pg-2 ansible_host=10.192.67.65
pg-3 ansible_host=10.192.67.184

[all:vars]
ansible_user=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3

[postgres:vars]
ansible_ssh_private_key_file=/root/.ssh/id_rsa
